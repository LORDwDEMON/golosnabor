<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ГолосНабор</title>
<style>
  :root {
    --bg: #F4F4F6;
    --card: #FFFFFF;
    --text: #111114;
    --muted: #6C6C74;
    --line: #EFEFF2;
    --accent: #0A84FF;
    --chip: #EFEFF2;
  }
  body.dark {
    --bg: #16161A;
    --card: #1F1F24;
    --text: #F2F2F4;
    --muted: #9B9BA4;
    --line: #2A2A31;
    --chip: #2A2A31;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    user-select: none;
    transition: background .2s, color .2s;
  }
  .panel { width: 100%; padding: 26px 24px 14px; display: flex; flex-direction: column; align-items: center; }

  .hero {
    width: 96px; height: 96px; padding: 0; border: 0; cursor: pointer;
    border-radius: 24px;
    background: linear-gradient(160deg, #3CB35A 0%, #1F7A38 55%, #14602B 100%);
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.28), 0 6px 16px rgba(20,96,43,.28);
    color: #fff; font: 600 17px/1 "Segoe UI", sans-serif;
    display: grid; place-items: center;
    transition: transform .15s;
  }
  .hero:hover { transform: translateY(-1px); }
  .hero:active { transform: scale(.97); }
  .hero.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: inset 0 0 0 3px rgba(0,0,0,.28), 0 0 0 0 rgba(60,179,90,.55); } 50% { box-shadow: inset 0 0 0 3px rgba(0,0,0,.28), 0 0 0 14px rgba(60,179,90,0); } }

  h1 { font: 400 31px/1.2 Georgia, "Times New Roman", serif; margin: 18px 0 6px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 14.5px; text-align: center; margin: 0 0 20px; max-width: 320px; }

  .card {
    width: 100%; background: var(--card); border-radius: 18px;
    box-shadow: 0 1px 2px rgba(16,16,20,.06), 0 6px 18px rgba(16,16,20,.05);
    padding: 2px 0; margin-bottom: 12px; overflow: hidden;
    transition: background .2s;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 52px; padding: 0 18px; gap: 14px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: rgba(127,127,140,.06); }
  .label { font-size: 15px; }
  .value { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .chip { background: var(--chip); color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
  .link { color: var(--accent); font-size: 14.5px; }
  .chev { color: #9A9AA2; font-size: 16px; transition: transform .2s; }
  .chev.open { transform: rotate(180deg); }
  .last { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .extra { display: none; }
  .extra.open { display: block; }

  .switch { position: relative; display: inline-block; width: 40px; height: 23px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: #C9C9CE; border-radius: 23px;
    transition: background .18s; cursor: pointer;
  }
  .switch span::before {
    content: ""; position: absolute; width: 19px; height: 19px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: transform .18s;
  }
  .switch input:checked + span { background: #34C759; }
  .switch input:checked + span::before { transform: translateX(17px); }

  footer {
    margin-top: auto; padding: 10px 0 2px;
    font-size: 10px; letter-spacing: 1.6px; color: #9A9AA0; text-transform: uppercase;
    text-align: center;
  }
  .hint { font-size: 12px; color: #B04A4A; margin-top: 4px; min-height: 14px; }
</style>
</head>
<body>
<main class="panel">
  <button class="hero" id="hero" title="Нажмите, чтобы начать или закончить диктовку">набор</button>
  <h1>Всё готово</h1>
  <p class="sub">Откройте любую программу, нажмите хоткей<br>и начните говорить</p>

  <section class="card">
    <div class="row clickable" id="row-hotkey">
      <span class="label">Хоткей</span>
      <span class="value"><span class="chip" id="hotkey">—</span></span>
    </div>
    <div class="row clickable" id="row-mode">
      <span class="label">Способ диктовки</span>
      <span class="value link" id="mode">—</span>
    </div>
    <div class="row">
      <span class="label">Микрофон</span>
      <span class="value link" id="mic">Системный</span>
    </div>
  </section>

  <section class="card">
    <div class="row clickable" id="row-look">
      <span class="label">Внешний вид и звуки</span>
      <span class="chev" id="look-chev">⌄</span>
    </div>
    <div class="extra" id="extra">
      <div class="row">
        <span class="label">Тёмная тема</span>
        <label class="switch"><input type="checkbox" id="dark"><span></span></label>
      </div>
      <div class="row">
        <span class="label">Звук начала и конца</span>
        <label class="switch"><input type="checkbox" id="sounds"><span></span></label>
      </div>
      <div class="row">
        <span class="label">Вставлять в активное окно</span>
        <label class="switch"><input type="checkbox" id="paste"><span></span></label>
      </div>
      <div class="row">
        <span class="label">Последняя фраза</span>
        <span class="value last" id="last">—</span>
      </div>
    </div>
  </section>

  <div class="hint" id="hint"></div>
  <footer>
    <div>Сборка 1.0 · воссоздано по внешним признакам</div>
  </footer>
</main>
<script src="panel.js"></script>
</body>
</html>
