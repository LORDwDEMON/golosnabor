<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Запись</title></head>
<body>
<script>
  // Скрытое окно: пишет звук с микрофона и отдаёт его главному процессу.
  let stream = null;
  let recorder = null;
  let chunks = [];
  let ctx = null;
  let timer = null;
  let startedAt = 0;
  let spoke = false;
  let silenceMs = 0;

  function pickMime() {
    const variants = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (const m of variants) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
  }

  function cleanup() {
    clearInterval(timer);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    if (ctx) ctx.close().catch(() => {});
    stream = null; ctx = null; recorder = null; timer = null;
  }

  async function start(opts) {
    chunks = [];
    spoke = false;
    silenceMs = 0;
    startedAt = Date.now();
    const maxMs = Math.max(5, Number(opts && opts.maxSeconds) || 60) * 1000;

    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });

    ctx = new AudioContext();
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    const data = new Uint8Array(analyser.fftSize);
    const spectrum = new Uint8Array(analyser.frequencyBinCount);
    const nyquist = ctx.sampleRate / 2;
    const binHz = nyquist / spectrum.length;

    // Средний уровень полосы частот (низкие, средние, высокие) — как в оригинале
    function bandAverage(fromHz, toHz) {
      const from = Math.max(0, Math.floor(fromHz / binHz));
      const to = Math.min(spectrum.length - 1, Math.floor(toHz / binHz));
      let sum = 0;
      for (let i = from; i <= to; i++) sum += spectrum[i];
      const count = Math.max(1, to - from + 1);
      return Math.min(1, (sum / count) / 180);
    }

    const mime = pickMime();
    recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : 'audio/webm' });
      const buffer = await blob.arrayBuffer();
      cleanup();
      window.recorderApi.done(buffer);
    };
    recorder.start(200);

    // Каждые 100 мс: уровень звука для указателя, определение тишины, предел записи.
    timer = setInterval(() => {
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      analyser.getByteFrequencyData(spectrum);
      window.recorderApi.level({
        rms: Math.min(1, rms * 6),
        low: bandAverage(60, 300),
        mid: bandAverage(300, 2000),
        high: bandAverage(2000, 6000),
      });

      const elapsed = Date.now() - startedAt;
      if (rms > 0.02) { spoke = true; silenceMs = 0; }
      else if (spoke) { silenceMs += 100; }

      if (spoke && silenceMs > 1300 && elapsed > 900) { stop(); return; }
      if (elapsed > maxMs) { window.recorderApi.tooLong(); stop(); }
    }, 100);
  }

  function stop() {
    if (recorder && recorder.state === 'recording') recorder.stop();
  }

  window.recorderApi.onStart((opts) => start(opts).catch((err) => {
    cleanup();
    window.recorderApi.done(new ArrayBuffer(0));
    console.error('запись не удалась:', err && err.message);
  }));
  window.recorderApi.onStop(() => stop());
</script>
</body>
</html>
